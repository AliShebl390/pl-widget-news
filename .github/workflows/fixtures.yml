name: Team news trigger

on:
  # Hourly check; does nothing unless an FPL deadline is 1-3 hours away.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run the routine now for the next gameweek, ignoring the timing check"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the next FPL deadline
        id: check
        run: python3 .github/fixtures.py ${{ inputs.force && '--force' || '' }}
      - name: Commit fixtures
        if: steps.check.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixtures.json state.json
          git diff --cached --quiet || (git commit -m "Fixtures for GW${{ steps.check.outputs.event }}" && git push)
      - name: Fire the Claude routine
        if: steps.check.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/dispatches \
            -f event_type=team-news \
            -F "client_payload[event]=${{ steps.check.outputs.event }}"

name: Update fixtures

on:
  # An hour before the Claude routine (Mon and Fri, 16:00 UTC).
  schedule:
    - cron: "0 15 * * 1,5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch upcoming fixtures
        run: python3 .github/fixtures.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixtures.json
          git diff --cached --quiet || (git commit -m "Update fixtures" && git push)
